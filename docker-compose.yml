# Local DEVELOPMENT: app with hot reload + PostgreSQL
# Run: docker compose up --build
services:
  app:
    build: .
    # Override the production CMD: one Uvicorn process that restarts on code changes
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false # works on a fresh clone without a .env file
    environment:
      # These win over values from .env
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/url_shortener # "db" = service below
      BASE_URL: http://localhost:8000
      # Windows/macOS do not send file-change events into containers; poll instead
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app # your code, live inside the container
    depends_on:
      migrate:
        condition: service_completed_successfully # start only after the schema is up to date

  # One-off job: brings the database to the newest migration, then exits.
  # Runs once, before the app, so app workers never race to migrate.
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/url_shortener
    volumes:
      - ./alembic:/app/alembic # new migrations are picked up without rebuilding
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy # wait until Postgres accepts connections

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: url_shortener
    ports:
      - "127.0.0.1:5432:5432" # only this computer can connect (used by tests and local runs)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data # keep data when the container is recreated
      # Scripts in this folder run on the very first start: creates the test database
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
