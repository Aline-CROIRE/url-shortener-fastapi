# Local DEVELOPMENT: app with hot reload + Redis
# Run: docker compose up --build
services:
  app:
    build: .
    # Override the production CMD: one Uvicorn process that restarts on code changes
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false # works on a fresh clone without a .env file
    environment:
      # These win over values from .env
      ENVIRONMENT: development
      DEBUG: "true"
      STORAGE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0 # "redis" = the service name below
      BASE_URL: http://localhost:8000
      # Windows/macOS do not send file-change events into containers; poll instead
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app # your code, live inside the container
    depends_on:
      redis:
        condition: service_healthy # wait until Redis answers PING

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379" # only this computer can connect (used by integration tests)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data # keep data when the container is recreated

volumes:
  redis-data:
