[pytest]
testpaths = tests
pythonpath = .
addopts = -v
markers =
    integration: needs a running Redis (REDIS_TEST_URL); skipped when Redis is not reachable
filterwarnings =
    # Starlette suggests the newer "httpx2" package for TestClient; httpx still works
    ignore:Using `httpx` with `starlette.testclient` is deprecated
