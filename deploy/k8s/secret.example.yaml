# EXAMPLE ONLY: placeholders, never applied by the kustomization. Create the real one:
#   kubectl create secret generic url-shortener-secrets \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://user:password@db-host:5432/url_shortener' \
#     --from-literal=JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=METRICS_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
# (or with your platform's secret store: Sealed Secrets, External Secrets, Vault, ...)
apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://change-me:change-me@db-host:5432/url_shortener
  JWT_SECRET_KEY: change-me-to-48-random-characters-change-me-change-me
  METRICS_TOKEN: change-me-to-a-random-token
