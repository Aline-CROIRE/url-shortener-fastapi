# The API: Gunicorn + Uvicorn workers (the image's default command), behind a Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never fewer ready pods than wanted during a deploy
      maxSurge: 1 # start one new pod at a time
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener-api
      annotations:
        # For a Prometheus that discovers pods by annotation (set METRICS_TOKEN in it too)
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      # Gunicorn's graceful_timeout is 30 s; the pod gets 45 s before it is killed
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # the image's "app" user (numeric: Kubernetes can check it)
        runAsGroup: 999
      containers:
        - name: api
          image: url-shortener:0.1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: url-shortener-config
            - secretRef:
                name: url-shortener-secrets
          # Each Argon2 hash takes 64 MB and each worker may run 4 at once:
          # 2 workers x 4 x 64 MB = 512 MB for logins alone, hence the 1 GiB limit
          resources:
            requests: {cpu: "1", memory: 512Mi}
            limits: {memory: 1Gi}
          # STARTUP: "finished starting?" (database reachable, schema at the newest
          # migration). Up to 30 x 5 s = 150 s; liveness and readiness wait for it.
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 5
            timeoutSeconds: 3 # longer than the app's own 2 s check
            failureThreshold: 30
          # LIVENESS: "is the process answering?" Checks nothing else: a database
          # outage must not restart every pod. 3 failures x 10 s = restart.
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            # A HUNG process ignores SIGTERM: kill it after 10 s, not the pod's 45 s
            # (those stay for normal shutdowns). Seen in kind: 46 s without this.
            terminationGracePeriodSeconds: 10
          # READINESS: "can it serve now?" (PostgreSQL + Redis). 2 failures x 5 s =
          # no traffic until it passes again; nothing restarts.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Kubernetes removes a stopping pod from the Service a moment AFTER telling
            # it to stop: wait 5 s so no new request reaches a closing Gunicorn
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # only /tmp is writable (below)
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp # Prometheus multiprocess files, Gunicorn worker heartbeats
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-api
spec:
  selector:
    app.kubernetes.io/name: url-shortener-api
  ports:
    - name: http
      port: 80
      targetPort: http # traffic goes only to pods whose readiness probe passes
---
# Voluntary disruptions (node upgrades, drains) must leave at least one API pod
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: url-shortener-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener-api
