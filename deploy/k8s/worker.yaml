# The Celery worker: saves clicks, runs the nightly archive. No HTTP: no Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener-worker
    spec:
      terminationGracePeriodSeconds: 60 # let a running task finish (warm shutdown)
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: worker
          image: url-shortener:0.1.0
          command:
            - celery
            - -A
            - app.worker.celery_app:celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=$(CELERY_CONCURRENCY) # Kubernetes fills it in from the ConfigMap
          envFrom:
            - configMapRef:
                name: url-shortener-config
            - secretRef:
                name: url-shortener-secrets
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
          # LIVENESS: the worker answers "ping" through the broker. Heavier than an
          # HTTP check (it starts Python), so every 60 s. No readiness: no traffic.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A app.worker.celery_app:celery_app inspect ping -d celery@$HOSTNAME --timeout 10
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
