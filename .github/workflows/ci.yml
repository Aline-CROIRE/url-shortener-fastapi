# Runs the quality checks and the test suite on every push and pull request.
name: CI

on:
  push:
  pull_request:
  # Every Monday at 06:00 UTC: new vulnerabilities are published all the time, so the
  # dependency audit must also run in weeks without a push
  schedule:
    - cron: "0 6 * * 1"

jobs:
  # OWASP A03:2025 Software Supply Chain Failures: fail if any pinned package has a
  # known vulnerability (checked against the PyPI / OSV advisory databases)
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # --no-deps --disable-pip: every version is pinned, so the exact versions in the
      # files are checked as they are (no installing or resolving needed)
      - name: Check pinned packages for known vulnerabilities
        run: >-
          pip-audit -r requirements.txt -r requirements-dev.txt
          --no-deps --disable-pip --progress-spinner off

  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: url_shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create the test database
        run: psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE url_shortener_test"
        env:
          PGPASSWORD: postgres

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests with coverage
        run: pytest --cov
