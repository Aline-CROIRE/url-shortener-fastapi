# One place for the project's tool settings (ruff, mypy, pytest, coverage).
# Dependencies stay in requirements.txt / requirements-dev.txt.

[project]
name = "url-shortener"
version = "0.1.0"
description = "URL shortener microservice: FastAPI, async SQLAlchemy 2.0, Alembic, PostgreSQL, Redis."
requires-python = ">=3.11"

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: style errors and warnings
    "F",       # pyflakes: unused imports, undefined names, ...
    "I",       # isort: import order
    "B",       # bugbear: likely bugs and design problems
    "UP",      # pyupgrade: modern Python syntax
    "SIM",     # simplifications
    "C4",      # better comprehensions
    "RUF",     # ruff's own rules
    "D",       # pydocstyle: docstrings
]
# The google convention switches D401 off; keep summaries as commands ("Return ...")
extend-select = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are documented by their names; docstrings are optional there
"tests/**" = ["D"]
# Migrations are frozen history generated by Alembic: only real errors are checked
"alembic/versions/**" = ["D", "E501", "UP", "I"]
"alembic/env.py" = ["D103"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy (type checking)
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
markers = [
    "integration: needs a running Redis or replica; skipped when it is not reachable",
]
filterwarnings = [
    # Starlette suggests the newer "httpx2" package for TestClient; httpx still works
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# ---------------------------------------------------------------- coverage (pytest --cov)
[tool.coverage.run]
source = ["app"]  # our application code only
branch = true     # both roads of every if/else

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 98
exclude_also = [
    'if __name__ == .__main__.:',  # tested by calling main() directly
    "if TYPE_CHECKING:",           # imports for type checkers only
]
