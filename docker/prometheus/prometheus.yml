# Prometheus for local development: docker compose --profile monitoring up -d
# Then open http://localhost:9090 and try, for example:
#   rate(http_requests_total[1m])                                         requests per second
#   histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m])))
#   sum by (result) (rate(redirect_cache_lookups_total[5m]))              cache hits vs misses
#   increase(click_events_total{outcome="lost"}[10m]) > 0                 alert: clicks lost
global:
  scrape_interval: 5s # production: 15-30s

scrape_configs:
  - job_name: url-shortener
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"] # the "app" service, inside the compose network
    # With METRICS_TOKEN set, Prometheus must send it:
    # authorization:
    #   credentials: <METRICS_TOKEN>

  # The Celery worker's own metrics: tasks (success/retry/failure), clicks saved/dropped,
  # URLs archived. Try: sum by (outcome) (rate(celery_tasks_total[5m]))
  - job_name: url-shortener-worker
    static_configs:
      - targets: ["celery-worker:9808"]
